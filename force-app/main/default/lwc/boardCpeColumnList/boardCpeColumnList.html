<template>
    <template lwc:if={hasColumns}>
        <ol class="c-columns">
            <template for:each={rows} for:item="row">
                <li
                    key={row.key}
                    class={row.rowClass}
                    data-index={row.index}
                    ondragover={handleDragOver}
                    ondrop={handleDrop}
                >
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <span
                            class="c-column-handle c-drag-handle"
                            draggable="true"
                            title="Drag to reorder"
                            data-index={row.index}
                            ondragstart={handleDragStart}
                            ondragend={handleDragEnd}
                        >
                            <lightning-icon
                                icon-name="utility:drag_and_drop"
                                size="x-small"
                                alternative-text=""
                            ></lightning-icon>
                        </span>
                        <span class="slds-text-title slds-truncate slds-col">
                            {row.title}: <code class="c-column-path">{row.fieldPath}</code>
                        </span>
                        <div class="slds-shrink-none">
                            <lightning-button-icon
                                class="c-column-up"
                                icon-name="utility:arrowup"
                                size="small"
                                variant="bare"
                                alternative-text="Move column up"
                                disabled={row.isFirst}
                                data-index={row.index}
                                onclick={handleMoveUp}
                            ></lightning-button-icon>
                            <lightning-button-icon
                                class="c-column-down"
                                icon-name="utility:arrowdown"
                                size="small"
                                variant="bare"
                                alternative-text="Move column down"
                                disabled={row.isLast}
                                data-index={row.index}
                                onclick={handleMoveDown}
                            ></lightning-button-icon>
                            <lightning-button-icon
                                class="c-column-remove"
                                icon-name="utility:delete"
                                size="small"
                                variant="bare"
                                alternative-text="Remove column"
                                data-index={row.index}
                                onclick={handleRemove}
                            ></lightning-button-icon>
                        </div>
                    </div>
                    <template lwc:if={row.isBucket}>
                        <p class="c-column-bucket slds-text-body_small">
                            Bucket field: <strong>{row.bucketLabel}</strong> (not sortable)
                        </p>
                    </template>
                    <template lwc:else>
                        <c-board-cpe-object-field-picker
                            class="c-column-field"
                            mode="field"
                            label="Field"
                            object-api-name={objectApiName}
                            value={row.fieldPath}
                            data-index={row.index}
                            onchange={handleField}
                        ></c-board-cpe-object-field-picker>
                    </template>
                    <lightning-input
                        class="c-column-label slds-m-top_xx-small"
                        label="Label"
                        placeholder="Field label"
                        value={row.label}
                        data-index={row.index}
                        data-name="label"
                        onchange={handleText}
                    ></lightning-input>
                    <lightning-input
                        class="c-column-width slds-m-top_xx-small"
                        label="Width"
                        placeholder="auto (e.g. 12rem)"
                        value={row.width}
                        data-index={row.index}
                        data-name="width"
                        onchange={handleText}
                    ></lightning-input>
                    <template lwc:if={row.isField}>
                        <lightning-combobox
                            class="c-column-display slds-m-top_xx-small"
                            label="Display as"
                            options={row.displayAsOptions}
                            value={row.displayAs}
                            data-index={row.index}
                            data-name="displayAs"
                            onchange={handleChoice}
                        ></lightning-combobox>
                        <template lwc:if={row.isDataBar}>
                            <lightning-input
                                class="c-column-bar-only slds-m-top_xx-small"
                                type="checkbox"
                                label="Bar only (hide the value)"
                                checked={row.barOnly}
                                data-index={row.index}
                                data-name="barOnly"
                                onchange={handleToggle}
                            ></lightning-input>
                        </template>
                        <lightning-combobox
                            class="c-column-link slds-m-top_xx-small"
                            label="Link to record"
                            options={linkOptions}
                            value={row.linkToRecord}
                            data-index={row.index}
                            data-name="linkToRecord"
                            onchange={handleChoice}
                        ></lightning-combobox>
                    </template>
                    <lightning-combobox
                        class="c-column-align slds-m-top_xx-small"
                        label="Align"
                        options={alignOptions}
                        value={row.align}
                        data-index={row.index}
                        data-name="align"
                        onchange={handleChoice}
                    ></lightning-combobox>
                    <lightning-input
                        class="c-column-wrap slds-m-top_xx-small"
                        type="checkbox"
                        label="Wrap text"
                        checked={row.wrapText}
                        data-index={row.index}
                        data-name="wrapText"
                        onchange={handleToggle}
                    ></lightning-input>
                    <lightning-input
                        class="c-column-narrow slds-m-top_xx-small"
                        type="checkbox"
                        label="Hide on narrow screens"
                        checked={row.hideOnNarrow}
                        data-index={row.index}
                        data-name="hideOnNarrow"
                        onchange={handleToggle}
                    ></lightning-input>
                    <template lwc:if={row.showFormat}>
                        <c-board-cpe-format-editor
                            class="c-column-format slds-m-top_xx-small"
                            value={row.format}
                            data-index={row.index}
                            onchange={handleFormat}
                        ></c-board-cpe-format-editor>
                    </template>
                </li>
            </template>
        </ol>
    </template>
    <c-board-cpe-object-field-picker
        class="c-column-add slds-m-top_x-small"
        mode="field"
        label={addLabel}
        object-api-name={objectApiName}
        onchange={handleAdd}
    ></c-board-cpe-object-field-picker>
    <template lwc:if={hasBucketFields}>
        <lightning-combobox
            class="c-column-add-bucket slds-m-top_x-small"
            label="Add a Bucket field column"
            placeholder="Choose a Bucket field"
            options={bucketOptions}
            onchange={handleAddBucket}
        ></lightning-combobox>
    </template>
</template>
