<template>
    <lightning-modal-header label={label}></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
            The conditions apply together with the Board's Filter context. Use groups to combine conditions with AND or
            OR.
        </p>
        <div class="c-base-filter-detail">
            <c-board-condition-editor
                class="c-base-filter-editor"
                value={tree}
                object-api-name={objectApiName}
                id-prefix={idPrefix}
                onconditionchange={handleConditionChange}
            ></c-board-condition-editor>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button class="c-dialog-cancel" label="Cancel" onclick={handleCancel}></lightning-button>
        <lightning-button
            class="c-dialog-save slds-m-left_x-small"
            variant="brand"
            label="Save"
            disabled={isSaveDisabled}
            onclick={handleSave}
        ></lightning-button>
    </lightning-modal-footer>
</template>
