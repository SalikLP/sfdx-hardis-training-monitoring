<template>
    <c-board-cpe-common
        widget-type="table"
        input-variables={inputVariables}
        builder-context={builderContext}
        element-info={elementInfo}
        onconfigchange={handleConfigChange}
    >
        <c-board-cpe-section
            class="c-table-columns"
            name={sections.columns.name}
            label="Columns"
            summary={sections.columns.summary}
            open={sections.columns.open}
            has-error={sections.columns.hasError}
            ontoggle={handleSectionToggle}
        >
            <c-board-cpe-column-list
                class="c-table-column-list"
                object-api-name={objectApiName}
                columns={columns}
                onchange={handleColumns}
            ></c-board-cpe-column-list>
        </c-board-cpe-section>

        <c-board-cpe-section
            class="c-table-display"
            name={sections.sorting.name}
            label="Sorting and paging"
            summary={sections.sorting.summary}
            open={sections.sorting.open}
            has-error={sections.sorting.hasError}
            ontoggle={handleSectionToggle}
        >
            <c-board-cpe-object-field-picker
                class="c-table-sort-by"
                mode="field"
                label="Default sort field"
                object-api-name={objectApiName}
                capability="sortable"
                value={sortBy}
                onchange={handleSortBy}
            ></c-board-cpe-object-field-picker>
            <lightning-radio-group
                class="c-table-sort-direction slds-m-top_x-small"
                name="sortDirection"
                label="Sort direction"
                type="button"
                options={directionOptions}
                value={sortDirection}
                onchange={handleSortDirection}
            ></lightning-radio-group>
            <lightning-input
                class="c-table-page-size slds-m-top_x-small"
                type="number"
                label="Page size"
                min="10"
                max="100"
                step="1"
                placeholder="25"
                value={pageSize}
                field-level-help="Rows fetched per page while scrolling (10–100, default 25)."
                onchange={handlePageSize}
            ></lightning-input>
            <lightning-input
                class="c-table-row-count slds-m-top_x-small"
                type="checkbox"
                label="Show row count"
                checked={showRowCount}
                onchange={handleShowRowCount}
            ></lightning-input>
        </c-board-cpe-section>

        <c-board-cpe-section
            class="c-table-child"
            name={sections.child.name}
            label="Child records"
            summary={sections.child.summary}
            open={sections.child.open}
            has-error={sections.child.hasError}
            ontoggle={handleSectionToggle}
        >
            <lightning-input
                class="c-table-child-toggle"
                type="checkbox"
                label="Expand rows to show child records"
                checked={hasChild}
                onchange={handleChildToggle}
            ></lightning-input>
            <template lwc:if={hasChild}>
                <c-board-cpe-object-field-picker
                    class="c-table-child-relationship slds-m-top_x-small"
                    mode="childRelationship"
                    label="Child relationship"
                    object-api-name={objectApiName}
                    value={childValue}
                    onchange={handleChildRelationship}
                ></c-board-cpe-object-field-picker>
                <lightning-input
                    class="c-table-child-label slds-m-top_x-small"
                    label="Child section label"
                    value={childLabel}
                    onchange={handleChildLabel}
                ></lightning-input>
                <h4 class="slds-text-title slds-m-top_small">Child columns</h4>
                <c-board-cpe-column-list
                    class="c-table-child-columns"
                    object-api-name={childObjectApiName}
                    columns={childColumns}
                    id-prefix="child"
                    add-label="Add child column"
                    onchange={handleChildColumns}
                ></c-board-cpe-column-list>
                <c-board-cpe-object-field-picker
                    class="c-table-child-sort-by slds-m-top_x-small"
                    mode="field"
                    label="Child sort field"
                    object-api-name={childObjectApiName}
                    capability="sortable"
                    value={childSortBy}
                    onchange={handleChildSortBy}
                ></c-board-cpe-object-field-picker>
                <lightning-radio-group
                    class="c-table-child-sort-direction slds-m-top_x-small"
                    name="childSortDirection"
                    label="Child sort direction"
                    type="button"
                    options={directionOptions}
                    value={childSortDirection}
                    onchange={handleChildSortDirection}
                ></lightning-radio-group>
                <lightning-input
                    class="c-table-child-limit slds-m-top_x-small"
                    type="number"
                    label="Child rows per parent"
                    min="1"
                    max="50"
                    step="1"
                    placeholder="10"
                    value={childLimit}
                    onchange={handleChildLimit}
                ></lightning-input>
            </template>
        </c-board-cpe-section>
    </c-board-cpe-common>
</template>
