<template>
    <div class="c-filter-definitions">
        <template lwc:if={hasRecordContextErrors}>
            <div class="c-filter-record-context-errors slds-m-bottom_small" role="alert">
                <template for:each={recordContextErrors} for:item="item">
                    <p key={item.key} class="slds-text-color_error slds-text-body_small">{item.message}</p>
                </template>
                <p class="slds-text-body_small slds-text-color_weak">
                    Fix the filter the override points at, or change the override in the Record context step.
                </p>
            </div>
        </template>
        <c-board-cpe-master-detail
            class="c-filter-master-detail"
            items={masterItems}
            selected-key={selectedKey}
            list-label="Filters"
            empty-message="No filters yet. Add one below."
            onitemselect={handleItemSelect}
            onitemmove={handleItemMove}
            onitemremove={handleItemRemove}
        >
            <div slot="actions">
                <lightning-combobox
                    class="c-filter-new-type"
                    field-level-help="The type of the next filter Add filter creates."
                    label="New filter type"
                    options={typeOptions}
                    value={newFilterType}
                    onchange={handleNewType}
                ></lightning-combobox>
                <lightning-button
                    class="c-filter-add slds-m-top_x-small"
                    label="Add filter"
                    icon-name="utility:add"
                    onclick={handleAddFilter}
                ></lightning-button>
                <lightning-button
                    class="c-filter-add-section slds-m-top_x-small slds-m-left_x-small"
                    label="Add section"
                    icon-name="utility:add"
                    onclick={handleAddSection}
                ></lightning-button>
                <lightning-button
                    class="c-filter-add-currency-picker slds-m-top_x-small slds-m-left_x-small"
                    label="Add currency picker"
                    icon-name="utility:add"
                    disabled={isAddCurrencyPickerDisabled}
                    onclick={handleAddCurrencyPicker}
                ></lightning-button>
            </div>
            <template lwc:if={row}>
                <div class="c-filter-detail" data-key={row.key}>
                    <h2 class="c-filter-title slds-text-heading_small slds-m-bottom_x-small">
                        {row.title}
                        <span class="slds-badge slds-m-left_xx-small">{row.typeLabel}</span>
                    </h2>
                    <template lwc:if={row.hasErrors}>
                        <ul class="c-filter-errors slds-m-bottom_small">
                            <template for:each={row.errors} for:item="item">
                                <li key={item.key} class="slds-text-color_error slds-text-body_small">
                                    {item.message}
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:if={row.isSection}>
                        <lightning-input
                            class="c-filter-section-label"
                            field-level-help="The heading shown above the filters that follow this Filter section in the bar."
                            label="Heading"
                            value={row.label}
                            data-index={row.index}
                            onchange={handleSectionLabel}
                        ></lightning-input>
                        <lightning-input
                            class="c-filter-section-collapsed slds-m-top_x-small"
                            field-level-help="Viewers see only the heading and the number of active filters until they expand the section."
                            type="checkbox"
                            label="Start collapsed"
                            checked={row.startCollapsed}
                            data-index={row.index}
                            onchange={handleSectionCollapsed}
                        ></lightning-input>
                    </template>
                    <template lwc:elseif={row.isCurrencyPicker}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                            Lets viewers pick the Display currency every Widget on this Board shows amounts in. It is
                            not a filter: it never changes which records count, and resets to the viewer's own currency
                            on each page load.
                        </p>
                        <template lwc:if={isCurrencyUnavailable}>
                            <p class="c-filter-currency-unavailable slds-text-body_small slds-m-bottom_x-small">
                                Unavailable: this org uses one currency, so viewers never see the picker.
                            </p>
                        </template>
                        <lightning-input
                            class="c-filter-currency-label"
                            field-level-help='The label above the Currency picker in the bar. Blank shows "Currency".'
                            label="Label"
                            placeholder="Currency"
                            value={row.label}
                            data-index={row.index}
                            onchange={handleCurrencyPickerLabel}
                        ></lightning-input>
                    </template>
                    <template lwc:else>
                        <div class="c-filter-fields">
                            <lightning-input
                                class="c-filter-label"
                                field-level-help="The label viewers see above the filter. The Filter id follows it until you edit the id."
                                label="Label"
                                value={row.label}
                                data-index={row.index}
                                onchange={handleLabel}
                            ></lightning-input>
                            <lightning-input
                                class="c-filter-id slds-m-top_x-small"
                                label="Filter id"
                                value={row.filterId}
                                field-level-help="Stable binding key. Derived from the label until you edit it."
                                data-index={row.index}
                                onchange={handleFilterId}
                            ></lightning-input>
                            <lightning-combobox
                                class="c-filter-type slds-m-top_x-small"
                                field-level-help="Changing the type clears the settings that belong to the old type."
                                label="Type"
                                options={typeOptions}
                                value={row.type}
                                data-index={row.index}
                                onchange={handleType}
                            ></lightning-combobox>
                            <template lwc:if={row.showSelectionMode}>
                                <lightning-radio-group
                                    class="c-filter-selection slds-m-top_x-small"
                                    name={row.selectionName}
                                    label="Selection"
                                    type="button"
                                    options={selectionOptions}
                                    value={row.selectionMode}
                                    data-index={row.index}
                                    onchange={handleSelectionMode}
                                ></lightning-radio-group>
                            </template>
                        </div>

                        <template lwc:if={row.isPicklist}>
                            <lightning-radio-group
                                class="c-filter-display slds-m-top_x-small"
                                name={row.displayName}
                                label="Display"
                                type="button"
                                options={displayOptions}
                                value={row.display}
                                data-index={row.index}
                                onchange={handleDisplay}
                            ></lightning-radio-group>
                            <lightning-radio-group
                                class="c-filter-options-source slds-m-top_x-small"
                                name={row.sourceName}
                                label="Options"
                                options={optionsSourceOptions}
                                value={row.optionsSource}
                                data-index={row.index}
                                onchange={handleOptionsSource}
                            ></lightning-radio-group>
                            <template lwc:if={row.isCustomOptions}>
                                <lightning-input
                                    class="c-filter-field slds-m-top_x-small"
                                    label="Convention field API name (optional)"
                                    placeholder="Status"
                                    value={row.fieldApiName}
                                    field-level-help="Widgets bind this filter to a field with this API name."
                                    data-index={row.index}
                                    onchange={handleFieldApiName}
                                ></lightning-input>
                                <ul class="c-filter-option-list slds-m-top_x-small">
                                    <template for:each={row.optionRows} for:item="option">
                                        <li key={option.key} class="slds-grid slds-grid_vertical-align-end">
                                            <lightning-input
                                                class="c-filter-option-label slds-col"
                                                field-level-help="What viewers see for this option."
                                                label="Option label"
                                                value={option.label}
                                                data-index={row.index}
                                                data-option-index={option.optionIndex}
                                                data-name="label"
                                                onchange={handleOptionText}
                                            ></lightning-input>
                                            <lightning-input
                                                class="c-filter-option-value slds-col slds-m-left_xx-small"
                                                field-level-help="The value the filter matches on the field."
                                                label="Value"
                                                value={option.value}
                                                data-index={row.index}
                                                data-option-index={option.optionIndex}
                                                data-name="value"
                                                onchange={handleOptionText}
                                            ></lightning-input>
                                            <lightning-button-icon
                                                class="c-filter-option-remove slds-m-left_xx-small"
                                                icon-name="utility:delete"
                                                size="small"
                                                variant="bare"
                                                alternative-text="Remove option"
                                                data-index={row.index}
                                                data-option-index={option.optionIndex}
                                                onclick={handleRemoveOption}
                                            ></lightning-button-icon>
                                        </li>
                                    </template>
                                </ul>
                                <lightning-button
                                    class="c-filter-option-add slds-m-top_xx-small"
                                    label="Add option"
                                    icon-name="utility:add"
                                    data-index={row.index}
                                    onclick={handleAddOption}
                                ></lightning-button>
                            </template>
                            <template lwc:else>
                                <c-board-cpe-object-field-picker
                                    class="c-filter-source-object slds-m-top_x-small"
                                    field-level-help="The object whose field supplies the values."
                                    mode="object"
                                    label="Options source object"
                                    value={row.sourceObjectApiName}
                                    data-index={row.index}
                                    onchange={handleSourceObject}
                                ></c-board-cpe-object-field-picker>
                                <c-board-cpe-object-field-picker
                                    class="c-filter-source-field slds-m-top_x-small"
                                    field-level-help="The field on that object."
                                    mode="field"
                                    label="Picklist field"
                                    object-api-name={row.sourceFieldObject}
                                    capability="picklist"
                                    max-hops="0"
                                    value={row.fieldApiName}
                                    data-index={row.index}
                                    onchange={handleSourceField}
                                ></c-board-cpe-object-field-picker>
                            </template>
                            <template lwc:if={row.hasDefaultChoices}>
                                <template lwc:if={row.isSingle}>
                                    <lightning-combobox
                                        class="c-filter-default-single slds-m-top_x-small"
                                        field-level-help="The value selected when a viewer opens the page."
                                        label="Default value"
                                        options={row.defaultSingleOptions}
                                        value={row.defaultSingle}
                                        data-index={row.index}
                                        onchange={handleDefaultSingle}
                                    ></lightning-combobox>
                                </template>
                                <template lwc:else>
                                    <lightning-checkbox-group
                                        class="c-filter-default-values slds-m-top_x-small"
                                        label="Default values"
                                        options={row.defaultChoices}
                                        value={row.defaultValues}
                                        data-index={row.index}
                                        onchange={handleDefaultValues}
                                    ></lightning-checkbox-group>
                                </template>
                            </template>
                            <template lwc:if={row.defaultChoicesMessage}>
                                <p
                                    class="c-filter-default-message slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                                >
                                    {row.defaultChoicesMessage}
                                </p>
                            </template>
                        </template>

                        <template lwc:if={row.isLookup}>
                            <c-board-cpe-object-field-picker
                                class="c-filter-target-object slds-m-top_x-small"
                                field-level-help="The object the viewer picks records of."
                                mode="object"
                                label="Lookup object"
                                value={row.targetObjectApiName}
                                data-index={row.index}
                                onchange={handleTargetObject}
                            ></c-board-cpe-object-field-picker>
                            <lightning-input
                                class="c-filter-field slds-m-top_x-small"
                                label="Convention field API name (optional)"
                                placeholder="AccountId"
                                value={row.fieldApiName}
                                field-level-help="Leave empty to bind to the Widget object's lookup to the selected object."
                                data-index={row.index}
                                onchange={handleFieldApiName}
                            ></lightning-input>
                            <template lwc:if={row.hasTargetObject}>
                                <lightning-record-picker
                                    class="c-filter-default-record slds-m-top_x-small"
                                    field-level-help="Records selected when a viewer opens the page."
                                    label="Default records"
                                    object-api-name={row.targetObjectApiName}
                                    data-index={row.index}
                                    onchange={handleDefaultRecord}
                                ></lightning-record-picker>
                            </template>
                            <template lwc:if={row.hasDefaultPills}>
                                <div class="slds-m-top_xx-small">
                                    <template for:each={row.defaultPills} for:item="pill">
                                        <lightning-pill
                                            key={pill.key}
                                            class="c-filter-default-pill"
                                            label={pill.label}
                                            data-index={row.index}
                                            data-value={pill.value}
                                            onremove={handleRemoveDefault}
                                        ></lightning-pill>
                                    </template>
                                </div>
                            </template>
                        </template>

                        <template lwc:if={row.isUser}>
                            <lightning-input
                                class="c-filter-field slds-m-top_x-small"
                                label="Convention field API name"
                                placeholder="OwnerId"
                                value={row.fieldApiName}
                                field-level-help="Defaults to OwnerId; use e.g. CreatedById to filter by creator."
                                data-index={row.index}
                                onchange={handleFieldApiName}
                            ></lightning-input>
                            <lightning-radio-group
                                class="c-filter-user-match-mode slds-m-top_x-small"
                                name={row.userMatchModeName}
                                label="Match"
                                options={userMatchModeOptions}
                                value={row.userMatchMode}
                                data-index={row.index}
                                onchange={handleUserMatchMode}
                            ></lightning-radio-group>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                Selected users and their team also matches records owned by everyone in a role below
                                each selected user's role.
                            </p>
                            <lightning-input
                                class="c-filter-queues slds-m-top_x-small"
                                field-level-help="Lets viewers pick queues as well as users."
                                type="checkbox"
                                label="Include queues"
                                checked={row.includeQueues}
                                data-index={row.index}
                                onchange={handleIncludeQueues}
                            ></lightning-input>
                            <lightning-input
                                class="c-filter-default-me slds-m-top_x-small"
                                field-level-help="Selects the viewer when they open the page."
                                type="checkbox"
                                label="Default to the current user (Me)"
                                checked={row.defaultMe}
                                data-index={row.index}
                                onchange={handleDefaultMe}
                            ></lightning-input>
                            <lightning-input
                                class="c-filter-default-user-search slds-m-top_x-small"
                                field-level-help="Search users (and queues) to select when a viewer opens the page."
                                type="search"
                                label="Default users"
                                placeholder="Search users…"
                                value={row.userSearchTerm}
                                data-index={row.index}
                                onchange={handleUserSearch}
                            ></lightning-input>
                            <template lwc:if={row.hasUserResults}>
                                <ul class="c-filter-default-user-results slds-m-top_xx-small">
                                    <template for:each={row.userResults} for:item="result">
                                        <li key={result.key}>
                                            <button
                                                type="button"
                                                class="slds-button c-filter-default-user-option"
                                                data-index={row.index}
                                                data-id={result.id}
                                                data-label={result.label}
                                                onclick={handleUserPick}
                                            >
                                                {result.label}
                                            </button>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:if={row.hasDefaultPills}>
                                <div class="slds-m-top_xx-small">
                                    <template for:each={row.defaultPills} for:item="pill">
                                        <lightning-pill
                                            key={pill.key}
                                            class="c-filter-default-pill"
                                            label={pill.label}
                                            data-index={row.index}
                                            data-value={pill.value}
                                            onremove={handleRemoveDefault}
                                        ></lightning-pill>
                                    </template>
                                </div>
                            </template>
                        </template>

                        <template lwc:if={row.isDateRange}>
                            <lightning-input
                                class="c-filter-field slds-m-top_x-small"
                                label="Convention field API name"
                                placeholder="CreatedDate"
                                value={row.fieldApiName}
                                field-level-help="Date or Date/Time field Widgets filter by convention."
                                data-index={row.index}
                                onchange={handleFieldApiName}
                            ></lightning-input>
                            <lightning-combobox
                                class="c-filter-date-default slds-m-top_x-small"
                                field-level-help="The date range selected when a viewer opens the page."
                                label="Default range"
                                options={dateDefaultOptions}
                                value={row.dateDefault}
                                data-index={row.index}
                                onchange={handleDateDefault}
                            ></lightning-combobox>
                            <template lwc:if={row.isCustomLiteral}>
                                <lightning-input
                                    class="c-filter-date-literal slds-m-top_x-small"
                                    field-level-help="A relative date literal such as LAST_N_DAYS:45 or NEXT_QUARTER."
                                    label="Relative date literal"
                                    placeholder="LAST_N_DAYS:30"
                                    value={row.customLiteral}
                                    data-index={row.index}
                                    onchange={handleCustomLiteral}
                                ></lightning-input>
                            </template>
                            <template lwc:if={row.isCustomDates}>
                                <lightning-input
                                    class="c-filter-date-from slds-m-top_x-small"
                                    field-level-help="Start of the default range (YYYY-MM-DD). Leave blank for no start."
                                    type="date"
                                    label="From"
                                    value={row.defaultFrom}
                                    data-index={row.index}
                                    data-name="from"
                                    onchange={handleDefaultDate}
                                ></lightning-input>
                                <lightning-input
                                    class="c-filter-date-to slds-m-top_x-small"
                                    field-level-help="End of the default range (YYYY-MM-DD). Leave blank for no end."
                                    type="date"
                                    label="To"
                                    value={row.defaultTo}
                                    data-index={row.index}
                                    data-name="to"
                                    onchange={handleDefaultDate}
                                ></lightning-input>
                            </template>
                        </template>

                        <template lwc:if={row.isNumberRange}>
                            <c-board-cpe-object-field-picker
                                class="c-filter-source-object slds-m-top_x-small"
                                field-level-help="The object whose field the viewer filters by a minimum and maximum."
                                mode="object"
                                label="Object"
                                value={row.sourceObjectApiName}
                                data-index={row.index}
                                onchange={handleSourceObject}
                            ></c-board-cpe-object-field-picker>
                            <c-board-cpe-object-field-picker
                                class="c-filter-source-field slds-m-top_x-small"
                                field-level-help="A number, currency or percent field. Widgets filter by this field name by convention."
                                mode="field"
                                label="Field"
                                object-api-name={row.sourceFieldObject}
                                capability="filterable,numeric"
                                max-hops="0"
                                value={row.fieldApiName}
                                data-index={row.index}
                                onchange={handleNumberField}
                            ></c-board-cpe-object-field-picker>
                            <template lwc:if={row.currencyField}>
                                <p
                                    class="c-filter-number-currency-help slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                                >
                                    A currency field: viewers type amounts in the Board's Display currency, shown next
                                    to the inputs.
                                </p>
                            </template>
                            <div class="slds-grid slds-gutters_x-small">
                                <div class="slds-col">
                                    <lightning-input
                                        class="c-filter-number-default-from slds-m-top_x-small"
                                        field-level-help="The minimum filled in when a viewer opens the page. Leave blank for none."
                                        type="number"
                                        step="any"
                                        label="Default minimum"
                                        value={row.numberDefaultFrom}
                                        data-index={row.index}
                                        data-name="from"
                                        onchange={handleNumberDefault}
                                    ></lightning-input>
                                </div>
                                <div class="slds-col">
                                    <lightning-input
                                        class="c-filter-number-default-to slds-m-top_x-small"
                                        field-level-help="The maximum filled in when a viewer opens the page. Leave blank for none."
                                        type="number"
                                        step="any"
                                        label="Default maximum"
                                        value={row.numberDefaultTo}
                                        data-index={row.index}
                                        data-name="to"
                                        onchange={handleNumberDefault}
                                    ></lightning-input>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={row.isBucket}>
                            <lightning-combobox
                                class="c-filter-bucket-field slds-m-top_x-small"
                                label="Bucket field"
                                placeholder="Choose a Bucket field"
                                field-level-help="The filter offers this Bucket field's labels. Define Bucket fields in the Bucket fields step."
                                options={bucketFieldOptions}
                                value={row.bucketFieldId}
                                data-index={row.index}
                                onchange={handleBucketField}
                            ></lightning-combobox>
                        </template>

                        <template lwc:if={row.isEmptyFilled}>
                            <c-board-cpe-object-field-picker
                                class="c-filter-source-object slds-m-top_x-small"
                                field-level-help="The object whose field supplies the values."
                                mode="object"
                                label="Object"
                                value={row.sourceObjectApiName}
                                data-index={row.index}
                                onchange={handleSourceObject}
                            ></c-board-cpe-object-field-picker>
                            <c-board-cpe-object-field-picker
                                class="c-filter-source-field slds-m-top_x-small"
                                field-level-help="The field on that object."
                                mode="field"
                                label="Field"
                                object-api-name={row.sourceFieldObject}
                                capability="filterable"
                                max-hops="0"
                                value={row.fieldApiName}
                                data-index={row.index}
                                onchange={handleSourceField}
                            ></c-board-cpe-object-field-picker>
                            <p
                                class="c-filter-empty-filled-help slds-text-body_small slds-text-color_weak slds-m-top_xx-small"
                            >
                                Long Text Area fields cannot be filtered. Add an ISBLANK() formula checkbox on the
                                object and filter on that instead.
                            </p>
                            <lightning-radio-group
                                class="c-filter-empty-filled-default slds-m-top_x-small"
                                name={row.displayName}
                                label="Default"
                                type="button"
                                options={emptyFilledDefaultOptions}
                                value={row.emptyFilledDefault}
                                data-index={row.index}
                                onchange={handleEmptyFilledDefault}
                            ></lightning-radio-group>
                        </template>

                        <template lwc:if={row.isText}>
                            <lightning-combobox
                                class="c-filter-match-mode slds-m-top_x-small"
                                field-level-help="SOSL searches all text fields; Contains and Starts with match one field."
                                label="Match mode"
                                options={matchModeOptions}
                                value={row.matchMode}
                                data-index={row.index}
                                onchange={handleMatchMode}
                            ></lightning-combobox>
                            <template lwc:if={row.showTextField}>
                                <lightning-input
                                    class="c-filter-field slds-m-top_x-small"
                                    label="Convention field API name (optional)"
                                    placeholder="Subject"
                                    value={row.fieldApiName}
                                    field-level-help="Text field Widgets match by convention; override per Widget with a field list."
                                    data-index={row.index}
                                    onchange={handleFieldApiName}
                                ></lightning-input>
                            </template>
                            <lightning-input
                                class="c-filter-min-chars slds-m-top_x-small"
                                field-level-help="The search runs once the viewer typed at least this many characters (2 to 50)."
                                type="number"
                                label="Minimum characters"
                                min="2"
                                max="50"
                                step="1"
                                placeholder="2"
                                value={row.minCharacters}
                                data-index={row.index}
                                onchange={handleMinCharacters}
                            ></lightning-input>
                            <lightning-input
                                class="c-filter-placeholder slds-m-top_x-small"
                                field-level-help="Hint text shown in the empty search box."
                                label="Placeholder"
                                placeholder="Search…"
                                value={row.placeholder}
                                data-index={row.index}
                                onchange={handlePlaceholder}
                            ></lightning-input>
                            <lightning-input
                                class="c-filter-default-text slds-m-top_x-small"
                                field-level-help="Search text filled in when a viewer opens the page."
                                label="Default search text"
                                value={row.defaultText}
                                data-index={row.index}
                                onchange={handleDefaultText}
                            ></lightning-input>
                        </template>
                    </template>
                </div>
            </template>
            <template lwc:else>
                <p class="c-filter-detail-empty slds-text-body_regular slds-text-color_weak slds-p-top_small">
                    Add a filter to edit its settings.
                </p>
            </template>
        </c-board-cpe-master-detail>
    </div>
</template>
