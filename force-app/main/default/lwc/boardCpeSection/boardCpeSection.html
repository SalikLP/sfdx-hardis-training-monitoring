<template>
    <div class={sectionClass}>
        <h3 class="slds-section__title">
            <button
                type="button"
                class="slds-button slds-section__title-action c-section-toggle"
                aria-expanded={ariaExpanded}
                aria-controls="config-section-content"
                onclick={handleToggle}
            >
                <lightning-icon
                    class="slds-button__icon_left slds-shrink-none"
                    icon-name={toggleIconName}
                    size="x-small"
                ></lightning-icon>
                <span class="c-section-title slds-shrink-none">{label}</span>
                <template lwc:if={showSummary}>
                    <span
                        class="c-section-summary slds-truncate slds-text-body_small slds-text-color_weak slds-m-left_x-small"
                        title={summary}
                        >{summary}</span
                    >
                </template>
                <template lwc:if={hasError}>
                    <lightning-icon
                        class="c-section-error slds-shrink-none slds-m-left_x-small"
                        icon-name="utility:error"
                        variant="error"
                        size="x-small"
                        alternative-text="This section has errors"
                        title="This section has errors"
                    ></lightning-icon>
                </template>
            </button>
        </h3>
        <div id="config-section-content" class="slds-section__content c-section-content" hidden={isCollapsed}>
            <slot></slot>
        </div>
    </div>
</template>
