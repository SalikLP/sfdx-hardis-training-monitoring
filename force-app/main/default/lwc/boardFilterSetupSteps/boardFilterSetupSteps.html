<template>
    <template lwc:if={isFilters}>
        <c-board-setup-filter-definitions
            class="c-filter-setup-definitions"
            config={config}
            onchange={handleDefinitionsChange}
        ></c-board-setup-filter-definitions>
    </template>

    <template lwc:if={isBucketFields}>
        <c-board-cpe-object-field-picker
            class="c-filter-bucket-object"
            mode="object"
            label="Pick rule fields from"
            field-level-help="The object whose fields the rule conditions start from while you set them up. Each Widget evaluates the rules on its own object."
            value={bucketObjectApiName}
            onchange={handleBucketObject}
        ></c-board-cpe-object-field-picker>
        <c-board-bucket-field-editor
            class="c-filter-bucket-editor slds-m-top_small"
            object-api-name={bucketObjectApiName}
            value={bucketFields}
            onchange={handleBucketFields}
        ></c-board-bucket-field-editor>
    </template>

    <template lwc:if={isRecordContext}>
        <lightning-combobox
            class="c-filter-rc-mode"
            label="Mode"
            field-level-help="What the Board does with the record it sits on. The text below the picker explains the chosen mode."
            options={recordContextOptions}
            value={recordContextMode}
            onchange={handleRecordContextMode}
        ></lightning-combobox>
        <div class="c-filter-rc-mode-help slds-m-top_xx-small slds-text-body_small slds-text-color_weak">
            <p class="c-filter-rc-mode-description">{recordContextModeHelp.description}</p>
            <p class="c-filter-rc-mode-example">
                <span class="slds-text-title_bold">Example:</span> {recordContextModeHelp.example}
            </p>
        </div>
        <lightning-combobox
            class="c-filter-rc-filter slds-m-top_x-small"
            label="Feed the record into filter"
            field-level-help="Locked and Default put the record into this filter of the Filter bar. Only Picklist, Lookup and User filters can receive it. Examples: on an Account page, pick the Account filter to show this Account. A Picklist filter receives a field of the record and needs a field path below: on an Account page, the Industry filter with field path Industry shows everything in the same industry as this Account."
            options={overrideFilterOptions}
            value={overrideFilterId}
            onchange={handleOverrideFilterId}
        ></lightning-combobox>
        <lightning-input
            class="c-filter-rc-path slds-m-top_x-small"
            label="Host record field path (optional)"
            placeholder="e.g. AccountId"
            value={overrideFieldPath}
            field-level-help="Leave blank to use the record itself. Fill in when the filter needs another value from the record: a field on it, or on a parent up to 5 levels up. Examples: on a Case page, AccountId feeds the Case's Account into the Account filter; OwnerId feeds its owner into the Owner filter; Account.ParentId feeds the parent Account."
            onchange={handleOverrideFieldPath}
        ></lightning-input>
        <template lwc:if={isLocked}>
            <lightning-input
                class="c-filter-rc-badge slds-m-top_x-small"
                type="checkbox"
                label="Show the locked record badge"
                field-level-help="Shows viewers which record the Board is locked to."
                checked={showRecordContextBadge}
                onchange={handleBadge}
            ></lightning-input>
        </template>
    </template>

    <template lwc:if={isPersistence}>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
            Where a viewer's selections are kept: until the browser tab closes, in this browser, or not at all.
        </p>
        <lightning-radio-group
            class="c-filter-persistence-mode"
            name="persistence"
            label="Persistence"
            options={persistenceOptions}
            value={persistence}
            onchange={handlePersistence}
        ></lightning-radio-group>
    </template>

    <template lwc:if={isCurrency}>
        <c-board-config-currency
            class="c-filter-config-currency"
            value={configCurrency}
            onchange={handleConfigCurrency}
        ></c-board-config-currency>
    </template>
</template>
