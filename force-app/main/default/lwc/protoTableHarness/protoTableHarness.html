<template>
    <div class="proto-shell slds-m-around_small">
        <!-- TOP CONTROL & FILTER BAR -->
        <div class="proto-control-panel slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                    <span class="slds-badge slds-theme_warning slds-m-right_small">PROTOTYPE — TICKET 12</span>
                    <span class="slds-text-heading_small">{currentVariantLabel}</span>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12 slds-text-align_right">
                    <lightning-button
                        label="Seed 260 Cases + Child Comments/Feeds"
                        variant="neutral"
                        onclick={handleSeed260}
                        disabled={isSeeding}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button
                        label="Seed 2,050 Cases (2K Scale Test)"
                        variant="brand-outline"
                        onclick={handleSeedBatchTowards2050}
                        disabled={isSeeding}>
                    </lightning-button>
                </div>
            </div>

            <template lwc:if={seedStatusMessage}>
                <div class="slds-ScopedNotification slds-ScopedNotification_light slds-m-bottom_small" role="status">
                    <span class="slds-text-body_small"><strong>Seed Status:</strong> {seedStatusMessage}</span>
                </div>
            </template>

            <!-- BOARD FILTER CONTEXT BAR + ENGINE SWITCHES -->
            <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
                    <lightning-input
                        type="search"
                        label="Free-Text Search (300ms debounce / Enter)"
                        placeholder="Search parent or child (e.g. Turbine, Firmware, SCADA)..."
                        value={searchText}
                        onchange={handleSearchInput}
                        onkeyup={handleSearchKeyUp}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_1-of-12">
                    <lightning-combobox
                        label="Status"
                        value={statusFilter}
                        options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_1-of-12">
                    <lightning-combobox
                        label="Priority"
                        value={priorityFilter}
                        options={priorityOptions}
                        onchange={handlePriorityChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12">
                    <lightning-combobox
                        label="Child Relationship"
                        value={childMode}
                        options={childModeOptions}
                        onchange={handleChildModeChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12">
                    <lightning-combobox
                        label="Child Fetch Strategy"
                        value={childFetchStrategy}
                        options={childFetchStrategyOptions}
                        onchange={handleChildFetchStrategyChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_2-of-12">
                    <lightning-combobox
                        label="Search Engine"
                        value={searchStrategy}
                        options={searchStrategyOptions}
                        onchange={handleSearchStrategyChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_6-of-12 slds-medium-size_1-of-12">
                    <lightning-combobox
                        label="Pagination"
                        value={paginationStrategy}
                        options={paginationStrategyOptions}
                        onchange={handlePaginationStrategyChange}>
                    </lightning-combobox>
                </div>
            </div>

            <!-- GUIDED WALKTHROUGH PRESET CHIPS -->
            <div class="slds-grid slds-wrap slds-grid_vertical-align-center slds-m-bottom_x-small">
                <span class="slds-text-title_caps slds-m-right_small">Guided Probes:</span>
                <button class="slds-button slds-button_neutral slds-m-right_xx-small slds-m-bottom_xx-small" data-term="Turbine" onclick={handleQuickPreset}>
                    🔍 "Turbine" (Child-Only Match → Auto-Expand)
                </button>
                <button class="slds-button slds-button_neutral slds-m-right_xx-small slds-m-bottom_xx-small" data-term="Firmware" onclick={handleQuickPreset}>
                    🔍 "Firmware" (Child-Only Match → Auto-Expand)
                </button>
                <button class="slds-button slds-button_neutral slds-m-right_xx-small slds-m-bottom_xx-small" data-term="SCADA" onclick={handleQuickPreset}>
                    🔍 "SCADA" (Child-Only Match → Auto-Expand)
                </button>
                <button class="slds-button slds-button_neutral slds-m-right_xx-small slds-m-bottom_xx-small" data-term="Substation" onclick={handleQuickPreset}>
                    🔍 "Substation" (Parent Subject Match)
                </button>
                <button class="slds-button slds-button_neutral slds-m-right_xx-small slds-m-bottom_xx-small" onclick={handleJumpOffset1975}>
                    ⏭ Jump to OFFSET 1,975
                </button>
                <button class="slds-button slds-button_neutral slds-m-right_xx-small slds-m-bottom_xx-small" onclick={handleProbeOffset2025Error}>
                    ⚠️ Probe OFFSET 2,025 (2K Limit Error)
                </button>
                <button class="slds-button slds-button_base slds-m-left_small slds-m-bottom_xx-small" onclick={handleResetFilters}>
                    Reset All
                </button>
            </div>

            <!-- LIVE TELEMETRY & STATE INSPECTOR -->
            <template lwc:if={telemetry}>
                <div class="proto-telemetry-bar slds-p-around_small">
                    <div class="slds-grid slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12">
                            <strong>STATE:</strong> Total Matches = <strong>{totalCountDisplay}</strong> (Loaded: <strong>{loadedRowCount}</strong>) |
                            Sort = <strong>{sortBy} {sortDirection}</strong> |
                            Pagination = <strong>{telemetry.paginationStrategy}</strong> (nextOffset={nextOffset}) |
                            Child Fetch = <strong>{telemetry.childFetchStrategy}</strong>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12 slds-text-align_right">
                            <strong>APEX TELEMETRY:</strong> {telemetry.elapsedMs} ms |
                            SOQL: {telemetry.soqlQueriesUsed}/100 |
                            SOSL: {telemetry.soslQueriesUsed}/20 |
                            Rows: {telemetry.queryRowsUsed} |
                            Heap: {telemetry.heapBytesUsed} B
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-m-top_xx-small">
                            <strong>SEARCH DIAGNOSTIC:</strong> {telemetry.executedSearchDiagnostic}
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-m-top_xx-small slds-truncate" title={telemetry.executedSoql}>
                            <strong>SOQL:</strong> {telemetry.executedSoql}
                        </div>
                    </div>
                </div>
            </template>

            <template lwc:if={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_small" role="alert">
                    <h2>{errorMessage}</h2>
                </div>
            </template>
        </div>

        <!-- BODY: VARIANT A (CUSTOM SLDS 1/2 TABLE) -->
        <template lwc:if={isVariantA}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                    <div>
                        <span class="slds-text-heading_small">Cases ({totalCountDisplay})</span>
                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">
                            Showing {loadedRowCount} loaded rows • Child sub-rows: {childObjectLabel}
                        </span>
                    </div>
                    <div>
                        <span class="proto-badge-parent-match slds-m-right_x-small">Parent Match</span>
                        <span class="proto-badge-child-match">★ Auto-Expanded Child Match</span>
                    </div>
                </div>

                <div class="proto-table-viewport" onscroll={handleViewportScroll}>
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer proto-slds-table" role="grid">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" style="width: 58px;">
                                    <div class="slds-truncate slds-p-horizontal_x-small" title="Expand Child Rows">Sub</div>
                                </th>
                                <template for:each={columnsMeta} for:item="col">
                                    <th key={col.fieldPath} scope="col" style={col.width} aria-sort={col.ariaSort}>
                                        <button class="proto-sort-btn" data-field={col.fieldPath} onclick={handleHeaderSort}>
                                            <span class="slds-truncate">{col.headerText}</span>
                                        </button>
                                    </th>
                                </template>
                                <th scope="col" style="width: 145px;">
                                    <div class="slds-truncate slds-p-horizontal_x-small">Match Source</div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={rows} for:item="row">
                                <tr key={row.id} class={row.trClass}>
                                    <td>
                                        <template lwc:if={row.hasChildren}>
                                            <button
                                                class="slds-button slds-button_neutral slds-p-horizontal_xx-small"
                                                data-rowid={row.id}
                                                aria-expanded={row.isExpanded}
                                                title="Toggle child records"
                                                onclick={handleToggleExpand}>
                                                {row.expandIcon} {row.childCount}
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <span class="slds-text-color_weak slds-p-left_x-small">—</span>
                                        </template>
                                    </td>
                                    <th scope="row">
                                        <a href={row.caseUrl} data-recordid={row.id} onclick={handleRecordLinkClick} class="slds-text-link">
                                            {row.caseNumber}
                                        </a>
                                    </th>
                                    <td>
                                        <div class="slds-truncate" title={row.subject}>
                                            <template for:each={row.subjectSegments} for:item="seg">
                                                <mark lwc:if={seg.isMatch} key={seg.key} class="proto-highlight">{seg.text}</mark>
                                                <span lwc:else key={seg.key}>{seg.text}</span>
                                            </template>
                                        </div>
                                    </td>
                                    <td>
                                        <template lwc:if={row.accountId}>
                                            <a href={row.accountUrl} data-recordid={row.accountId} onclick={handleRecordLinkClick} class="slds-text-link">
                                                <template for:each={row.accountSegments} for:item="seg">
                                                    <mark lwc:if={seg.isMatch} key={seg.key} class="proto-highlight">{seg.text}</mark>
                                                    <span lwc:else key={seg.key}>{seg.text}</span>
                                                </template>
                                            </a>
                                        </template>
                                        <template lwc:else>—</template>
                                    </td>
                                    <td>
                                        <template lwc:if={row.contactId}>
                                            <a href={row.contactUrl} data-recordid={row.contactId} onclick={handleRecordLinkClick} class="slds-text-link">
                                                <template for:each={row.contactSegments} for:item="seg">
                                                    <mark lwc:if={seg.isMatch} key={seg.key} class="proto-highlight">{seg.text}</mark>
                                                    <span lwc:else key={seg.key}>{seg.text}</span>
                                                </template>
                                            </a>
                                        </template>
                                        <template lwc:else>—</template>
                                    </td>
                                    <td>
                                        <lightning-badge label={row.status}></lightning-badge>
                                    </td>
                                    <td>
                                        <lightning-badge label={row.priority}></lightning-badge>
                                    </td>
                                    <td>
                                        <lightning-formatted-date-time
                                            value={row.createdDate}
                                            year="numeric"
                                            month="short"
                                            day="2-digit">
                                        </lightning-formatted-date-time>
                                    </td>
                                    <td>
                                        <template lwc:if={row.matchedOnParent}>
                                            <span class="proto-badge-parent-match slds-m-right_xx-small">Parent</span>
                                        </template>
                                        <template lwc:if={row.matchedOnChild}>
                                            <span class="proto-badge-child-match">★ Child ({row.matchedChildCount})</span>
                                        </template>
                                    </td>
                                </tr>

                                <!-- EXPANDED CHILD SUB-ROW DRAWER -->
                                <template lwc:if={row.isExpanded}>
                                    <tr key={row.caseUrl} class="proto-child-drawer-row">
                                        <td colspan="9">
                                            <div class="proto-child-subtable slds-p-around_small">
                                                <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                                                    <span class="slds-text-title_bold">
                                                        ↳ Child {childObjectLabel} for Case #{row.caseNumber}
                                                    </span>
                                                    <template lwc:if={row.matchedOnChild}>
                                                        <span class="proto-badge-child-match">
                                                            Auto-expanded because free-text search matched {row.matchedChildCount} child record(s)
                                                        </span>
                                                    </template>
                                                </div>

                                                <template lwc:if={row.isFetchingChildren}>
                                                    <div class="slds-p-around_small slds-text-color_weak">
                                                        Lazy-fetching child records via BoardQueryService (USER_MODE)...
                                                    </div>
                                                </template>
                                                <template lwc:else>
                                                    <table class="slds-table slds-table_bordered slds-table_compact">
                                                        <thead>
                                                            <tr>
                                                                <th scope="col" style="width: 150px;">Author</th>
                                                                <th scope="col" style="width: 110px;">Visibility</th>
                                                                <th scope="col">Comment / Feed Body (Dedicated Child Schema)</th>
                                                                <th scope="col" style="width: 150px;">Created Date</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template for:each={row.children} for:item="child">
                                                                <tr key={child.id} class={child.childTrClass}>
                                                                    <td>{child.authorName}</td>
                                                                    <td>
                                                                        <lightning-badge label={child.publishedBadge}></lightning-badge>
                                                                    </td>
                                                                    <td class="slds-cell-wrap">
                                                                        <template lwc:if={child.isSearchMatch}>
                                                                            <span class="proto-badge-child-match slds-m-right_x-small">MATCH</span>
                                                                        </template>
                                                                        <template for:each={child.bodySegments} for:item="seg">
                                                                            <mark lwc:if={seg.isMatch} key={seg.key} class="proto-highlight">{seg.text}</mark>
                                                                            <span lwc:else key={seg.key}>{seg.text}</span>
                                                                        </template>
                                                                    </td>
                                                                    <td>
                                                                        <lightning-formatted-date-time
                                                                            value={child.createdDate}
                                                                            year="numeric"
                                                                            month="short"
                                                                            day="2-digit"
                                                                            hour="2-digit"
                                                                            minute="2-digit">
                                                                        </lightning-formatted-date-time>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </template>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- ACCESSIBLEINFINITE SCROLL FOOTER -->
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_small">
                    <span class="slds-text-body_small slds-text-color_weak">
                        Loaded {loadedRowCount} of {totalCountDisplay} matching records (scroll container or click Load More)
                    </span>
                    <template lwc:if={hasMore}>
                        <lightning-button
                            label="Load More (+25 Rows)"
                            variant="neutral"
                            onclick={handleLoadMoreClick}
                            disabled={isLoadingMore}>
                        </lightning-button>
                    </template>
                </div>
            </div>
        </template>

        <!-- BODY: VARIANT B (STANDARD LIGHTNING-DATATABLE + SEPARATE DRAWER) -->
        <template lwc:if={isVariantB}>
            <div class="slds-p-around_medium">
                <div class="slds-ScopedNotification slds-ScopedNotification_light slds-m-bottom_small">
                    <strong>Variant B Note (`lightning-datatable`):</strong> Cannot render inline expandable child sub-rows (`&lt;tr colspan&gt;`) inside its shadow DOM or render inline `&lt;mark&gt;` search highlights. Requires flattening 1–5 hop dot-paths into synthetic URL fields (`accountUrl` + `accountName`) and relegating child `CaseComment`/`FeedItem` records to an external panel below.
                </div>
                <div class="proto-datatable-container">
                    <lightning-datatable
                        key-field="id"
                        data={rows}
                        columns={datatableColumns}
                        hide-checkbox-column
                        sorted-by={sortBy}
                        sorted-direction={datatableSortDirection}
                        onsort={handleDatatableSort}
                        enable-infinite-loading={hasMore}
                        onloadmore={handleDatatableLoadMore}
                        onrowaction={handleDatatableRowAction}>
                    </lightning-datatable>
                </div>

                <template lwc:if={selectedDatatableRow}>
                    <div class="proto-child-subtable slds-p-around_small slds-m-top_small">
                        <div class="slds-text-title_bold slds-m-bottom_x-small">
                            External Companion Panel — Child {childObjectLabel} for Selected Case #{selectedDatatableRow.caseNumber}
                        </div>
                        <template for:each={selectedDatatableRow.children} for:item="child">
                            <div key={child.id} class="slds-p-vertical_xx-small slds-border_bottom">
                                <strong>{child.authorName}:</strong> {child.body}
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <!-- BODY: VARIANT C (STANDARD LIGHTNING-TREE-GRID) -->
        <template lwc:if={isVariantC}>
            <div class="slds-p-around_medium">
                <div class="slds-ScopedNotification slds-ScopedNotification_light slds-m-bottom_small">
                    <strong>Variant C Note (`lightning-tree-grid`):</strong> Supports auto-expanding `expanded-rows` on search match, but forces heterogeneous child `CaseComment`/`FeedItem` records into the parent `Case` column headers (`Case #`, `Subject`, `Account.Name`, `Status`, `Priority`) and lacks `enable-infinite-loading` support.
                </div>
                <div class="proto-table-viewport">
                    <lightning-tree-grid
                        key-field="id"
                        data={treeGridRows}
                        columns={treeGridColumns}
                        expanded-rows={treeGridExpandedIds}
                        hide-checkbox-column>
                    </lightning-tree-grid>
                </div>
            </div>
        </template>

        <!-- BODY: VARIANT SPLIT (SIDE-BY-SIDE COMPARE) -->
        <template lwc:if={isVariantSplit}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-wrap slds-gutters_small">
                    <!-- LEFT: CUSTOM SLDS TABLE -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12">
                        <div class="slds-text-heading_small slds-m-bottom_x-small">
                            Left: Custom SLDS 1/2 &lt;table&gt; (Inline Child Sub-Table + Highlights)
                        </div>
                        <div class="proto-table-viewport" onscroll={handleViewportScroll}>
                            <table class="slds-table slds-table_bordered slds-table_compact proto-slds-table">
                                <thead>
                                    <tr>
                                        <th scope="col" style="width: 52px;">Sub</th>
                                        <th scope="col" style="width: 90px;">Case #</th>
                                        <th scope="col">Subject</th>
                                        <th scope="col" style="width: 130px;">Account.Name</th>
                                        <th scope="col" style="width: 95px;">Match</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={rows} for:item="row">
                                        <tr key={row.id} class={row.trClass}>
                                            <td>
                                                <template lwc:if={row.hasChildren}>
                                                    <button class="slds-button slds-button_neutral slds-p-horizontal_xx-small" data-rowid={row.id} onclick={handleToggleExpand}>
                                                        {row.expandIcon}{row.childCount}
                                                    </button>
                                                </template>
                                            </td>
                                            <td>
                                                <a href={row.caseUrl} data-recordid={row.id} onclick={handleRecordLinkClick}>{row.caseNumber}</a>
                                            </td>
                                            <td class="slds-truncate" title={row.subject}>
                                                <template for:each={row.subjectSegments} for:item="seg">
                                                    <mark lwc:if={seg.isMatch} key={seg.key} class="proto-highlight">{seg.text}</mark>
                                                    <span lwc:else key={seg.key}>{seg.text}</span>
                                                </template>
                                            </td>
                                            <td class="slds-truncate">
                                                <a href={row.accountUrl} data-recordid={row.accountId} onclick={handleRecordLinkClick}>{row.accountName}</a>
                                            </td>
                                            <td>
                                                <template lwc:if={row.matchedOnChild}>
                                                    <span class="proto-badge-child-match">★ Child</span>
                                                </template>
                                                <template lwc:elseif={row.matchedOnParent}>
                                                    <span class="proto-badge-parent-match">Parent</span>
                                                </template>
                                            </td>
                                        </tr>
                                        <template lwc:if={row.isExpanded}>
                                            <tr key={row.caseUrl} class="proto-child-drawer-row">
                                                <td colspan="5">
                                                    <div class="proto-child-subtable slds-p-around_x-small">
                                                        <template for:each={row.children} for:item="child">
                                                            <div key={child.id} class={child.childTrClass}>
                                                                <strong>{child.authorName}: </strong>
                                                                <template for:each={child.bodySegments} for:item="seg">
                                                                    <mark lwc:if={seg.isMatch} key={seg.key} class="proto-highlight">{seg.text}</mark>
                                                                    <span lwc:else key={seg.key}>{seg.text}</span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- RIGHT: LIGHTNING-TREE-GRID -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_6-of-12">
                        <div class="slds-text-heading_small slds-m-bottom_x-small">
                            Right: Standard lightning-tree-grid (Shared Parent Columns)
                        </div>
                        <div class="proto-table-viewport">
                            <lightning-tree-grid
                                key-field="id"
                                data={treeGridRows}
                                columns={treeGridColumns}
                                expanded-rows={treeGridExpandedIds}
                                hide-checkbox-column>
                            </lightning-tree-grid>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- FLOATING PROTOTYPE VARIANT SWITCHER BAR (PER PROTOTYPE SKILL UI.md) -->
        <div class="proto-floating-switcher" role="navigation" aria-label="Prototype Variant Switcher">
            <button class="proto-switcher-arrow" onclick={handlePrevVariant} title="Previous Variant (Left Arrow)">
                ←
            </button>
            <template for:each={variantItems} for:item="v">
                <button
                    key={v.key}
                    class={v.pillClass}
                    data-variant={v.key}
                    onclick={handleSelectVariant}>
                    {v.shortLabel}
                </button>
            </template>
            <button class="proto-switcher-arrow" onclick={handleNextVariant} title="Next Variant (Right Arrow)">
                →
            </button>
        </div>
    </div>
</template>
