<template>
    <article class="slds-card c-board-card">
        <div class="slds-card__header slds-grid slds-grid_vertical-align-center">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small slds-truncate" title={effectiveTitle}
                            >{effectiveTitle}</span
                        >
                    </h2>
                </div>
            </header>
            <div class="slds-no-flex slds-grid slds-grid_vertical-align-center">
                <template lwc:if={isRefreshing}>
                    <div class="c-board-header-spinner slds-m-right_x-small">
                        <lightning-spinner size="x-small" alternative-text="Refreshing data"></lightning-spinner>
                    </div>
                </template>
                <template lwc:if={filterBindingSummary}>
                    <lightning-helptext
                        class="c-board-binding-help slds-m-right_xx-small"
                        icon-name="utility:info_alt"
                        content={filterBindingSummary}
                        alternative-text="Filter binding details"
                    ></lightning-helptext>
                </template>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    size="small"
                    variant="bare"
                    alternative-text="Refresh widget"
                    title="Refresh widget"
                    onclick={handleRefreshClick}
                ></lightning-button-icon>
            </div>
        </div>
        <div class="slds-card__body slds-card__body_inner c-board-metric-container">
            <template lwc:if={showCursorProgress}>
                <div class="c-board-cursor-progress" role="status" aria-live="polite">
                    <lightning-progress-bar value={cursorProgress.percent} size="small"></lightning-progress-bar>
                    <p class="c-board-cursor-progress-label slds-text-body_small">{cursorProgress.label}</p>
                </div>
            </template>
            <template lwc:if={showWidgetState}>
                <c-board-widget-state
                    state={viewState}
                    waiting-for-board-id={waitingBoardId}
                    widget-type="metric"
                    error={errorPayload}
                    has-active-filters={hasActiveFilters}
                    onretry={handleRetry}
                ></c-board-widget-state>
            </template>
            <template lwc:elseif={showMetricBody}>
                <div class={bodyClass} data-scope-key={activeScopeKey} aria-busy={ariaBusy}>
                    <div class="c-board-metric-kpi">
                        <span class={valueClass} title={exactValue}>{displayValue}</span>
                        <template lwc:if={thresholdIcon}>
                            <lightning-icon
                                class="c-board-metric-status"
                                icon-name={thresholdIcon}
                                variant={thresholdVariant}
                                size="x-small"
                                alternative-text={thresholdLabel}
                                title={thresholdLabel}
                            ></lightning-icon>
                        </template>
                    </div>
                    <template lwc:if={gaugeModel}>
                        <c-board-metric-gauge-view model={gaugeModel}></c-board-metric-gauge-view>
                    </template>
                    <template lwc:if={gaugeError}>
                        <p class="c-board-metric-gauge-error slds-text-body_small" role="alert">{gaugeError}</p>
                    </template>
                    <template lwc:if={subtitle}>
                        <p class="c-board-metric-subtitle slds-text-body_small">{subtitle}</p>
                    </template>
                    <template for:each={crossObjectNoticeRows} for:item="notice">
                        <p key={notice.key} class="c-board-cross-object-notice slds-text-body_small">
                            <lightning-icon
                                icon-name="utility:warning"
                                size="x-small"
                                alternative-text="Warning"
                            ></lightning-icon>
                            <span>{notice.message}</span>
                        </p>
                    </template>
                </div>
            </template>
        </div>
    </article>
</template>
