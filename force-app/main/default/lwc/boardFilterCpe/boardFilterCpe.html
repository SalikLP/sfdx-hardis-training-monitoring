<template>
    <c-board-cpe-common
        widget-type="filter"
        input-variables={inputVariables}
        builder-context={builderContext}
        element-info={elementInfo}
        onconfigchange={handleConfigChange}
    >
        <c-board-cpe-section
            class="c-filter-definitions"
            name={sections.filters.name}
            label="Filters"
            summary={sections.filters.summary}
            open={sections.filters.open}
            has-error={sections.filters.hasError}
            ontoggle={handleSectionToggle}
        >
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                Filters show in this order. Widgets bind them by filterId.
            </p>
            <template lwc:if={hasFilters}>
                <ol class="c-filter-list">
                    <template for:each={filterRows} for:item="row">
                        <li
                            key={row.key}
                            class="c-filter-row slds-grid slds-grid_vertical-align-center slds-p-vertical_xx-small"
                        >
                            <span class="c-filter-title slds-truncate" title={row.label}>{row.label}</span>
                            <span class="c-filter-type-badge slds-badge slds-m-left_xx-small slds-shrink-none"
                                >{row.typeLabel}</span
                            >
                            <template lwc:if={row.hasError}>
                                <lightning-icon
                                    class="c-filter-error slds-m-left_xx-small slds-shrink-none"
                                    icon-name="utility:error"
                                    variant="error"
                                    size="x-small"
                                    alternative-text={row.errorText}
                                    title={row.errorText}
                                ></lightning-icon>
                            </template>
                        </li>
                    </template>
                </ol>
            </template>
            <template lwc:else>
                <p class="c-filter-empty slds-text-body_small slds-text-color_weak">No filters yet.</p>
            </template>
            <lightning-button
                class="c-filter-edit slds-m-top_x-small"
                label="Edit filters…"
                icon-name="utility:edit"
                onclick={handleEditFilters}
            ></lightning-button>
        </c-board-cpe-section>

        <c-board-cpe-section
            class="c-filter-record-context"
            name={sections.recordContext.name}
            label="Record context"
            summary={sections.recordContext.summary}
            open={sections.recordContext.open}
            has-error={sections.recordContext.hasError}
            ontoggle={handleSectionToggle}
        >
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                Applies when the Board receives a record Id (Record Pages or a Flow recordId).
            </p>
            <lightning-combobox
                class="c-filter-rc-mode"
                label="Mode"
                options={recordContextOptions}
                value={recordContextMode}
                onchange={handleRecordContextMode}
            ></lightning-combobox>
            <lightning-combobox
                class="c-filter-rc-filter slds-m-top_x-small"
                label="Feed the record into filter"
                options={overrideFilterOptions}
                value={overrideFilterId}
                onchange={handleOverrideFilterId}
            ></lightning-combobox>
            <lightning-input
                class="c-filter-rc-path slds-m-top_x-small"
                label="Host record field path (optional)"
                placeholder="AccountId"
                value={overrideFieldPath}
                field-level-help="Read this field (1–5 hop parent path) from the host record instead of its Id."
                onchange={handleOverrideFieldPath}
            ></lightning-input>
            <template lwc:if={isLocked}>
                <lightning-input
                    class="c-filter-rc-badge slds-m-top_x-small"
                    type="checkbox"
                    label="Show the locked record badge"
                    checked={showRecordContextBadge}
                    onchange={handleBadge}
                ></lightning-input>
            </template>
        </c-board-cpe-section>

        <c-board-cpe-section
            class="c-filter-persistence"
            name={sections.persistence.name}
            label="Remember selections"
            summary={sections.persistence.summary}
            open={sections.persistence.open}
            has-error={sections.persistence.hasError}
            ontoggle={handleSectionToggle}
        >
            <lightning-radio-group
                class="c-filter-persistence-mode"
                name="persistence"
                label="Persistence"
                options={persistenceOptions}
                value={persistence}
                onchange={handlePersistence}
            ></lightning-radio-group>
        </c-board-cpe-section>
    </c-board-cpe-common>
</template>
