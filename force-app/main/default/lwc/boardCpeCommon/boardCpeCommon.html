<template>
    <div class="c-cpe slds-p-around_x-small">
        <template lwc:if={storedJsonError}>
            <div class="c-cpe-stored-error slds-text-color_error slds-m-bottom_small" role="alert">
                {storedJsonError} Editing below rewrites configJson from scratch; paste a corrected copy in the Config
                JSON drawer to keep the old settings.
            </div>
        </template>

        <section class="c-cpe-section" aria-label="Board">
            <h3 class="slds-text-title_caps slds-m-bottom_x-small">Board</h3>
            <lightning-input
                class="c-cpe-board-id"
                label="Board id"
                value={boardIdValue}
                placeholder="default"
                field-level-help="Filter widgets and Widgets with the same Board id share one Filter context."
                onchange={handleBoardIdChange}
            ></lightning-input>
            <lightning-input
                class="c-cpe-title slds-m-top_x-small"
                label="Title"
                value={titleValue}
                onchange={handleTitleChange}
            ></lightning-input>
            <template lwc:if={isDataWidget}>
                <div class="slds-m-top_x-small">
                    <c-board-cpe-object-field-picker
                        class="c-cpe-object"
                        mode="object"
                        label="Object"
                        value={objectApiNameValue}
                        onchange={handleObjectChange}
                    ></c-board-cpe-object-field-picker>
                </div>
            </template>
            <template lwc:if={isBar}>
                <lightning-radio-group
                    class="c-cpe-orientation slds-m-top_x-small"
                    name="orientation"
                    label="Orientation"
                    type="button"
                    options={orientationOptions}
                    value={orientationValue}
                    onchange={handleOrientationChange}
                ></lightning-radio-group>
            </template>
            <template lwc:if={hasReferenceNotes}>
                <ul class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
                    <template for:each={referenceNotes} for:item="note">
                        <li key={note.key}>{note.text}</li>
                    </template>
                </ul>
            </template>
        </section>

        <slot></slot>

        <template lwc:if={isDataWidget}>
            <section class="c-cpe-section c-cpe-bindings slds-m-top_medium" aria-label="Filter bindings">
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">Filter bindings</h3>
                <p class="c-cpe-discovery slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                    {discoveryMessage}
                </p>
                <template lwc:if={hasBindingRows}>
                    <ul class="c-cpe-binding-list">
                        <template for:each={bindingRows} for:item="row">
                            <li
                                key={row.key}
                                class="c-cpe-binding-row slds-p-vertical_x-small"
                                data-filter-id={row.filterId}
                            >
                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                    <div class="slds-truncate">
                                        <span class="c-cpe-binding-label">{row.label}</span>
                                        <span class="slds-badge slds-m-left_xx-small">{row.typeLabel}</span>
                                        <code class="c-cpe-binding-id slds-m-left_xx-small">{row.filterId}</code>
                                    </div>
                                    <template lwc:if={row.isManual}>
                                        <lightning-button-icon
                                            class="c-cpe-binding-remove"
                                            icon-name="utility:delete"
                                            size="small"
                                            variant="bare"
                                            alternative-text="Remove filter binding"
                                            data-filter-id={row.filterId}
                                            onclick={handleManualRemove}
                                        ></lightning-button-icon>
                                    </template>
                                </div>
                                <p class="slds-text-body_small">
                                    Convention: <span class="c-cpe-binding-convention">{row.conventionText}</span>
                                </p>
                                <lightning-combobox
                                    class="c-cpe-binding-mode slds-m-top_xx-small"
                                    label="Binding"
                                    variant="label-inline"
                                    options={bindingModeOptions}
                                    value={row.mode}
                                    data-filter-id={row.filterId}
                                    onchange={handleBindingModeChange}
                                ></lightning-combobox>
                                <template lwc:if={row.isPath}>
                                    <lightning-input
                                        class="c-cpe-binding-path slds-m-top_xx-small"
                                        label="Binding path"
                                        value={row.path}
                                        placeholder="Account.Parent.Owner.Name"
                                        field-level-help={bindingPathHelp}
                                        data-filter-id={row.filterId}
                                        onchange={handleBindingPathChange}
                                    ></lightning-input>
                                    <c-board-cpe-object-field-picker
                                        class="c-cpe-binding-picker slds-m-top_xx-small"
                                        mode="field"
                                        label="Pick a field, parent path, or child relationship"
                                        object-api-name={objectApiNameValue}
                                        capability="filterable"
                                        allow-child-relationships
                                        data-filter-id={row.filterId}
                                        onchange={handleBindingPick}
                                    ></c-board-cpe-object-field-picker>
                                </template>
                                <template lwc:if={row.error}>
                                    <p
                                        class="c-cpe-binding-error slds-text-color_error slds-text-body_small"
                                        role="alert"
                                    >
                                        {row.error}
                                    </p>
                                </template>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Applies as: <span class="c-cpe-binding-effective">{row.effectiveText}</span>
                                </p>
                            </li>
                        </template>
                    </ul>
                </template>
                <div class="slds-grid slds-grid_vertical-align-end slds-m-top_x-small">
                    <lightning-input
                        class="c-cpe-manual-id slds-col"
                        label="Filter id (Filter widget outside this Flow)"
                        value={manualDraft}
                        placeholder="e.g. region or $recordContext"
                        onchange={handleManualDraftChange}
                    ></lightning-input>
                    <lightning-button
                        class="c-cpe-manual-add slds-m-left_x-small"
                        label="Add binding"
                        onclick={handleManualAdd}
                    ></lightning-button>
                </div>
                <template lwc:if={manualError}>
                    <p class="c-cpe-manual-error slds-text-color_error slds-text-body_small" role="alert">
                        {manualError}
                    </p>
                </template>
            </section>

            <section class="c-cpe-section c-cpe-base-filters slds-m-top_medium" aria-label="Base filters">
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">Base filters</h3>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                    Static conditions combined with AND alongside the Board's Filter context.
                </p>
                <template lwc:if={hasBaseFilters}>
                    <ol class="c-cpe-base-filter-list">
                        <template for:each={baseFilterRows} for:item="row">
                            <li key={row.key} class="c-cpe-base-filter slds-p-vertical_x-small" data-id={row.id}>
                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                    <span class="slds-text-title">{row.title}</span>
                                    <lightning-button-icon
                                        class="c-cpe-base-filter-remove"
                                        icon-name="utility:delete"
                                        size="small"
                                        variant="bare"
                                        alternative-text="Remove condition"
                                        data-id={row.id}
                                        onclick={handleRemoveBaseFilter}
                                    ></lightning-button-icon>
                                </div>
                                <c-board-cpe-object-field-picker
                                    class="c-cpe-base-filter-field"
                                    mode="field"
                                    label="Field"
                                    object-api-name={objectApiNameValue}
                                    capability="filterable"
                                    allow-child-relationships
                                    value={row.fieldPath}
                                    data-id={row.id}
                                    onchange={handleBaseFilterField}
                                ></c-board-cpe-object-field-picker>
                                <lightning-combobox
                                    class="c-cpe-base-filter-operator slds-m-top_xx-small"
                                    label="Operator"
                                    options={operatorOptions}
                                    value={row.operator}
                                    data-id={row.id}
                                    onchange={handleBaseFilterOperator}
                                ></lightning-combobox>
                                <template lwc:if={row.isScalar}>
                                    <lightning-input
                                        class="c-cpe-base-filter-value slds-m-top_xx-small"
                                        label="Value"
                                        value={row.scalarValue}
                                        field-level-help="Dates use YYYY-MM-DD."
                                        data-id={row.id}
                                        onchange={handleBaseFilterValue}
                                    ></lightning-input>
                                </template>
                                <template lwc:if={row.isList}>
                                    <lightning-input
                                        class="c-cpe-base-filter-list slds-m-top_xx-small"
                                        label="Values (comma-separated)"
                                        value={row.scalarValue}
                                        data-id={row.id}
                                        onchange={handleBaseFilterList}
                                    ></lightning-input>
                                </template>
                                <template lwc:if={row.isNull}>
                                    <lightning-combobox
                                        class="c-cpe-base-filter-null slds-m-top_xx-small"
                                        label="Condition"
                                        options={nullOptions}
                                        value={row.nullValue}
                                        data-id={row.id}
                                        onchange={handleBaseFilterNull}
                                    ></lightning-combobox>
                                </template>
                                <template lwc:if={row.isLiteral}>
                                    <lightning-combobox
                                        class="c-cpe-base-filter-literal slds-m-top_xx-small"
                                        label="Relative date"
                                        options={literalOptions}
                                        value={row.literalSelection}
                                        data-id={row.id}
                                        onchange={handleBaseFilterLiteral}
                                    ></lightning-combobox>
                                    <template lwc:if={row.isCustomLiteral}>
                                        <lightning-input
                                            class="c-cpe-base-filter-custom-literal slds-m-top_xx-small"
                                            label="Custom literal"
                                            value={row.literalValue}
                                            placeholder="LAST_N_DAYS:30"
                                            data-id={row.id}
                                            onchange={handleBaseFilterCustomLiteral}
                                        ></lightning-input>
                                    </template>
                                </template>
                                <template lwc:if={row.error}>
                                    <p
                                        class="c-cpe-base-filter-error slds-text-color_error slds-text-body_small"
                                        role="alert"
                                    >
                                        {row.error}
                                    </p>
                                </template>
                            </li>
                        </template>
                    </ol>
                </template>
                <lightning-button
                    class="c-cpe-base-filter-add slds-m-top_x-small"
                    label="Add condition"
                    icon-name="utility:add"
                    onclick={handleAddBaseFilter}
                ></lightning-button>
            </section>
        </template>

        <section class="c-cpe-section c-cpe-drawer slds-m-top_medium" aria-label="Config JSON">
            <button
                type="button"
                class="slds-button c-cpe-drawer-toggle"
                aria-expanded={drawerExpanded}
                aria-controls="cpe-json-panel"
                onclick={handleToggleDrawer}
            >
                <lightning-icon
                    icon-name={drawerToggleIcon}
                    size="x-small"
                    class="slds-m-right_x-small"
                ></lightning-icon>
                View / Copy Config JSON
            </button>
            <template lwc:if={isDrawerOpen}>
                <div id="cpe-json-panel" class="c-cpe-drawer-panel slds-m-top_x-small">
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                        Copy this configJson into Lightning App Builder, or paste a configJson here and apply it.
                    </p>
                    <div class="slds-form-element">
                        <label class="slds-form-element__label" for="cpe-json-text">configJson</label>
                        <div class="slds-form-element__control">
                            <textarea
                                id="cpe-json-text"
                                class="slds-textarea c-cpe-json"
                                rows="12"
                                spellcheck="false"
                                oninput={handleJsonInput}
                            ></textarea>
                        </div>
                    </div>
                    <template lwc:if={hasDraftErrors}>
                        <ul class="c-cpe-json-errors slds-text-color_error slds-text-body_small" role="alert">
                            <template for:each={draftErrorItems} for:item="item">
                                <li key={item.key}>{item.message}</li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:if={draftIsValid}>
                        <p class="c-cpe-json-valid slds-text-color_success slds-text-body_small">
                            Valid configuration. Apply to update this component.
                        </p>
                    </template>
                    <div class="slds-m-top_x-small">
                        <lightning-button
                            class="c-cpe-json-copy"
                            label="Copy"
                            icon-name="utility:copy"
                            onclick={handleCopyJson}
                        ></lightning-button>
                        <lightning-button
                            class="c-cpe-json-apply slds-m-left_x-small"
                            variant="brand"
                            label="Apply JSON"
                            disabled={applyDisabled}
                            onclick={handleApplyJson}
                        ></lightning-button>
                        <lightning-button
                            class="c-cpe-json-discard slds-m-left_x-small"
                            label="Discard changes"
                            disabled={discardDisabled}
                            onclick={handleDiscardJson}
                        ></lightning-button>
                    </div>
                    <template lwc:if={drawerMessage}>
                        <p class="c-cpe-json-message slds-text-body_small slds-m-top_x-small" role="status">
                            {drawerMessage}
                        </p>
                    </template>
                </div>
            </template>
        </section>
    </div>
</template>
