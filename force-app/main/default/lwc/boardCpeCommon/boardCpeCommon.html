<template>
    <div class="c-cpe slds-p-around_x-small">
        <template lwc:if={storedJsonError}>
            <div class="c-cpe-stored-error slds-text-color_error slds-m-bottom_small" role="alert">
                {storedJsonError} Editing below rewrites configJson from scratch; paste a corrected copy in Advanced:
                Config JSON to keep the old settings.
            </div>
        </template>

        <c-board-cpe-section
            class="c-cpe-board"
            name={sections.board.name}
            label="Board"
            summary={sections.board.summary}
            open={sections.board.open}
            has-error={sections.board.hasError}
            ontoggle={handleSectionToggle}
        >
            <lightning-input
                class="c-cpe-board-id"
                label="Board id"
                value={boardIdValue}
                placeholder="default"
                field-level-help="Filter widgets and Widgets with the same Board id share one Filter context."
                onchange={handleBoardIdChange}
            ></lightning-input>
            <lightning-input
                class="c-cpe-title slds-m-top_x-small"
                label="Title"
                value={titleValue}
                onchange={handleTitleChange}
            ></lightning-input>
            <template lwc:if={isDataWidget}>
                <div class="slds-m-top_x-small">
                    <c-board-cpe-object-field-picker
                        class="c-cpe-object"
                        mode="object"
                        label="Object"
                        value={objectApiNameValue}
                        onchange={handleObjectChange}
                    ></c-board-cpe-object-field-picker>
                </div>
            </template>
            <template lwc:if={isBar}>
                <lightning-radio-group
                    class="c-cpe-orientation slds-m-top_x-small"
                    name="orientation"
                    label="Orientation"
                    type="button"
                    options={orientationOptions}
                    value={orientationValue}
                    onchange={handleOrientationChange}
                ></lightning-radio-group>
            </template>
            <template lwc:if={hasReferenceNotes}>
                <ul class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
                    <template for:each={referenceNotes} for:item="note">
                        <li key={note.key}>{note.text}</li>
                    </template>
                </ul>
            </template>
        </c-board-cpe-section>

        <slot></slot>

        <template lwc:if={isDataWidget}>
            <c-board-cpe-section
                class="c-cpe-bindings"
                name={sections.bindings.name}
                label="Filter bindings"
                summary={sections.bindings.summary}
                open={sections.bindings.open}
                has-error={sections.bindings.hasError}
                ontoggle={handleSectionToggle}
            >
                <p class="c-cpe-discovery slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                    {discoveryMessage}
                </p>
                <template lwc:if={hasBindingRows}>
                    <ul class="c-cpe-binding-list">
                        <template for:each={bindingRows} for:item="row">
                            <li
                                key={row.key}
                                class="c-cpe-binding-row slds-p-vertical_x-small"
                                data-filter-id={row.filterId}
                            >
                                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                    <div class="slds-truncate">
                                        <span class="c-cpe-binding-label">{row.label}</span>
                                        <span class="slds-badge slds-m-left_xx-small">{row.typeLabel}</span>
                                        <code class="c-cpe-binding-id slds-m-left_xx-small">{row.filterId}</code>
                                    </div>
                                    <template lwc:if={row.isManual}>
                                        <lightning-button-icon
                                            class="c-cpe-binding-remove"
                                            icon-name="utility:delete"
                                            size="small"
                                            variant="bare"
                                            alternative-text="Remove filter binding"
                                            data-filter-id={row.filterId}
                                            onclick={handleManualRemove}
                                        ></lightning-button-icon>
                                    </template>
                                </div>
                                <p class="slds-text-body_small">
                                    Convention: <span class="c-cpe-binding-convention">{row.conventionText}</span>
                                </p>
                                <lightning-combobox
                                    class="c-cpe-binding-mode slds-m-top_xx-small"
                                    label="Binding"
                                    variant="label-inline"
                                    options={bindingModeOptions}
                                    value={row.mode}
                                    data-filter-id={row.filterId}
                                    onchange={handleBindingModeChange}
                                ></lightning-combobox>
                                <template lwc:if={row.isPath}>
                                    <lightning-input
                                        class="c-cpe-binding-path slds-m-top_xx-small"
                                        label="Binding path"
                                        value={row.path}
                                        placeholder="Account.Parent.Owner.Name"
                                        field-level-help={bindingPathHelp}
                                        data-filter-id={row.filterId}
                                        onchange={handleBindingPathChange}
                                    ></lightning-input>
                                    <c-board-cpe-object-field-picker
                                        class="c-cpe-binding-picker slds-m-top_xx-small"
                                        mode="field"
                                        label="Pick a field, parent path, or child relationship"
                                        object-api-name={objectApiNameValue}
                                        capability="filterable"
                                        allow-child-relationships
                                        data-filter-id={row.filterId}
                                        onchange={handleBindingPick}
                                    ></c-board-cpe-object-field-picker>
                                </template>
                                <template lwc:if={row.error}>
                                    <p
                                        class="c-cpe-binding-error slds-text-color_error slds-text-body_small"
                                        role="alert"
                                    >
                                        {row.error}
                                    </p>
                                </template>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Applies as: <span class="c-cpe-binding-effective">{row.effectiveText}</span>
                                </p>
                            </li>
                        </template>
                    </ul>
                </template>
                <div class="slds-grid slds-grid_vertical-align-end slds-m-top_x-small">
                    <lightning-input
                        class="c-cpe-manual-id slds-col"
                        label="Filter id (Filter widget outside this Flow)"
                        value={manualDraft}
                        placeholder="e.g. region or $recordContext"
                        onchange={handleManualDraftChange}
                    ></lightning-input>
                    <lightning-button
                        class="c-cpe-manual-add slds-m-left_x-small"
                        label="Add binding"
                        onclick={handleManualAdd}
                    ></lightning-button>
                </div>
                <template lwc:if={manualError}>
                    <p class="c-cpe-manual-error slds-text-color_error slds-text-body_small" role="alert">
                        {manualError}
                    </p>
                </template>
            </c-board-cpe-section>

            <c-board-cpe-section
                class="c-cpe-base-filters"
                name={sections.baseFilters.name}
                label="Base filters"
                summary={sections.baseFilters.summary}
                open={sections.baseFilters.open}
                has-error={sections.baseFilters.hasError}
                ontoggle={handleSectionToggle}
            >
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                    Static conditions combined with AND alongside the Board's Filter context.
                </p>
                <template lwc:if={hasBaseFilters}>
                    <ol class="c-cpe-base-filter-rows">
                        <template for:each={baseFilterRows} for:item="row">
                            <li
                                key={row.key}
                                class="c-cpe-base-filter slds-grid slds-grid_vertical-align-center slds-p-vertical_xx-small"
                                data-id={row.id}
                            >
                                <span class="c-cpe-base-filter-text slds-truncate" title={row.text}>{row.text}</span>
                                <span
                                    class="c-cpe-base-filter-operator-badge slds-badge slds-m-left_xx-small slds-shrink-none"
                                    >{row.operatorLabel}</span
                                >
                                <template lwc:if={row.hasError}>
                                    <lightning-icon
                                        class="c-cpe-base-filter-error slds-m-left_xx-small slds-shrink-none"
                                        icon-name="utility:error"
                                        variant="error"
                                        size="x-small"
                                        alternative-text={row.errorText}
                                        title={row.errorText}
                                    ></lightning-icon>
                                </template>
                            </li>
                        </template>
                    </ol>
                </template>
                <template lwc:else>
                    <p class="c-cpe-base-filter-empty slds-text-body_small slds-text-color_weak">No conditions.</p>
                </template>
                <lightning-button
                    class="c-cpe-base-filters-edit slds-m-top_x-small"
                    label="Edit base filters…"
                    icon-name="utility:edit"
                    onclick={handleEditBaseFilters}
                ></lightning-button>
            </c-board-cpe-section>
        </template>

        <c-board-cpe-section
            class="c-cpe-drawer"
            name={sections.advanced.name}
            label="Advanced: Config JSON"
            summary={sections.advanced.summary}
            open={sections.advanced.open}
            has-error={sections.advanced.hasError}
            ontoggle={handleSectionToggle}
        >
            <div class="c-cpe-drawer-panel">
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                    Copy this configJson into Lightning App Builder, or paste a configJson here and apply it.
                </p>
                <div class="slds-form-element">
                    <label class="slds-form-element__label" for="cpe-json-text">configJson</label>
                    <div class="slds-form-element__control">
                        <textarea
                            id="cpe-json-text"
                            class="slds-textarea c-cpe-json"
                            rows="12"
                            spellcheck="false"
                            oninput={handleJsonInput}
                        ></textarea>
                    </div>
                </div>
                <template lwc:if={hasDraftErrors}>
                    <ul class="c-cpe-json-errors slds-text-color_error slds-text-body_small" role="alert">
                        <template for:each={draftErrorItems} for:item="item">
                            <li key={item.key}>{item.message}</li>
                        </template>
                    </ul>
                </template>
                <template lwc:if={draftIsValid}>
                    <p class="c-cpe-json-valid slds-text-color_success slds-text-body_small">
                        Valid configuration. Apply to update this component.
                    </p>
                </template>
                <div class="slds-m-top_x-small">
                    <lightning-button
                        class="c-cpe-json-copy"
                        label="Copy"
                        icon-name="utility:copy"
                        onclick={handleCopyJson}
                    ></lightning-button>
                    <lightning-button
                        class="c-cpe-json-apply slds-m-left_x-small"
                        variant="brand"
                        label="Apply JSON"
                        disabled={applyDisabled}
                        onclick={handleApplyJson}
                    ></lightning-button>
                    <lightning-button
                        class="c-cpe-json-discard slds-m-left_x-small"
                        label="Discard changes"
                        disabled={discardDisabled}
                        onclick={handleDiscardJson}
                    ></lightning-button>
                </div>
                <template lwc:if={drawerMessage}>
                    <p class="c-cpe-json-message slds-text-body_small slds-m-top_x-small" role="status">
                        {drawerMessage}
                    </p>
                </template>
            </div>
        </c-board-cpe-section>
    </div>
</template>
