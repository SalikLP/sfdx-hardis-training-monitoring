<template>
    <c-board-cpe-common
        widget-type="metric"
        input-variables={inputVariables}
        builder-context={builderContext}
        element-info={elementInfo}
        onconfigchange={handleConfigChange}
    >
        <c-board-cpe-section
            class="c-metric-measure"
            name={sections.measure.name}
            label="Measure"
            summary={sections.measure.summary}
            open={sections.measure.open}
            has-error={sections.measure.hasError}
            ontoggle={handleSectionToggle}
        >
            <lightning-combobox
                class="c-metric-aggregate"
                label="Aggregate function"
                options={aggregateOptions}
                value={aggregateFunction}
                onchange={handleAggregate}
            ></lightning-combobox>
            <template lwc:if={showValueField}>
                <c-board-cpe-object-field-picker
                    class="c-metric-value-field slds-m-top_x-small"
                    mode="field"
                    label="Value field"
                    object-api-name={objectApiName}
                    capability={valueCapability}
                    value={valueFieldApiName}
                    onchange={handleValueField}
                ></c-board-cpe-object-field-picker>
                <p class="slds-text-body_small slds-text-color_weak">{valueFieldHelp}</p>
            </template>
            <lightning-input
                class="c-metric-subtitle slds-m-top_x-small"
                label="Subtitle"
                value={subtitle}
                onchange={handleSubtitle}
            ></lightning-input>
            <c-board-cpe-format-editor
                class="c-metric-format slds-m-top_x-small"
                default-notation={defaultNotation}
                value={format}
                onchange={handleFormat}
            ></c-board-cpe-format-editor>
        </c-board-cpe-section>

        <c-board-cpe-section
            class="c-metric-thresholds"
            name={sections.thresholds.name}
            label="Thresholds"
            summary={sections.thresholds.summary}
            open={sections.thresholds.open}
            has-error={sections.thresholds.hasError}
            ontoggle={handleSectionToggle}
        >
            <p class="c-metric-threshold-caption slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                When the value matches a rule, show its status. Rules are checked in order; the first match colors the
                value.
            </p>
            <template lwc:if={hasThresholds}>
                <ol class="c-metric-threshold-list" aria-label="Threshold rules">
                    <template for:each={thresholdRows} for:item="row">
                        <li
                            key={row.key}
                            class={row.rowClass}
                            data-index={row.index}
                            ondragover={handleThresholdDragOver}
                            ondrop={handleThresholdDrop}
                        >
                            <span
                                class="c-metric-threshold-handle c-drag-handle"
                                draggable="true"
                                title="Drag to reorder"
                                data-index={row.index}
                                ondragstart={handleThresholdDragStart}
                                ondragend={handleThresholdDragEnd}
                            >
                                <lightning-icon
                                    icon-name="utility:drag_and_drop"
                                    size="x-small"
                                    alternative-text=""
                                ></lightning-icon>
                            </span>
                            <lightning-combobox
                                class="c-metric-threshold-operator"
                                label={row.operatorLabel}
                                variant="label-hidden"
                                options={thresholdOperatorOptions}
                                value={row.operator}
                                data-index={row.index}
                                onchange={handleThresholdOperator}
                            ></lightning-combobox>
                            <lightning-input
                                class="c-metric-threshold-value"
                                type="number"
                                step="any"
                                label={row.valueLabel}
                                variant="label-hidden"
                                value={row.value}
                                data-index={row.index}
                                onchange={handleThresholdValue}
                            ></lightning-input>
                            <lightning-combobox
                                class="c-metric-threshold-variant"
                                label={row.variantLabel}
                                variant="label-hidden"
                                options={thresholdVariantOptions}
                                value={row.variant}
                                data-index={row.index}
                                onchange={handleThresholdVariant}
                            ></lightning-combobox>
                            <div class="c-metric-threshold-actions">
                                <lightning-button-icon
                                    class="c-metric-threshold-up"
                                    icon-name="utility:arrowup"
                                    size="small"
                                    variant="bare"
                                    alternative-text={row.moveUpLabel}
                                    disabled={row.isFirst}
                                    data-index={row.index}
                                    onclick={handleMoveThresholdUp}
                                ></lightning-button-icon>
                                <lightning-button-icon
                                    class="c-metric-threshold-down"
                                    icon-name="utility:arrowdown"
                                    size="small"
                                    variant="bare"
                                    alternative-text={row.moveDownLabel}
                                    disabled={row.isLast}
                                    data-index={row.index}
                                    onclick={handleMoveThresholdDown}
                                ></lightning-button-icon>
                                <lightning-button-icon
                                    class="c-metric-threshold-remove"
                                    icon-name="utility:delete"
                                    size="small"
                                    variant="bare"
                                    alternative-text={row.removeLabel}
                                    data-index={row.index}
                                    onclick={handleRemoveThreshold}
                                ></lightning-button-icon>
                            </div>
                        </li>
                    </template>
                </ol>
            </template>
            <lightning-button
                class="c-metric-threshold-add slds-m-top_x-small"
                label="Add rule"
                icon-name="utility:add"
                onclick={handleAddThreshold}
            ></lightning-button>
        </c-board-cpe-section>
    </c-board-cpe-common>
</template>
