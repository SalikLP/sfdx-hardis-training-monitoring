<template>
    <c-board-cpe-common
        widget-type="metric"
        input-variables={inputVariables}
        builder-context={builderContext}
        element-info={elementInfo}
        onconfigchange={handleConfigChange}
    >
        <section class="c-cpe-section c-metric-measure slds-m-top_medium" aria-label="Measure">
            <h3 class="slds-text-title_caps slds-m-bottom_x-small">Measure</h3>
            <lightning-combobox
                class="c-metric-aggregate"
                label="Aggregate function"
                options={aggregateOptions}
                value={aggregateFunction}
                onchange={handleAggregate}
            ></lightning-combobox>
            <template lwc:if={showValueField}>
                <c-board-cpe-object-field-picker
                    class="c-metric-value-field slds-m-top_x-small"
                    mode="field"
                    label="Value field"
                    object-api-name={objectApiName}
                    capability={valueCapability}
                    value={valueFieldApiName}
                    onchange={handleValueField}
                ></c-board-cpe-object-field-picker>
                <p class="slds-text-body_small slds-text-color_weak">{valueFieldHelp}</p>
            </template>
            <lightning-input
                class="c-metric-subtitle slds-m-top_x-small"
                label="Subtitle"
                value={subtitle}
                onchange={handleSubtitle}
            ></lightning-input>
            <c-board-cpe-format-editor
                class="c-metric-format slds-m-top_x-small"
                default-notation="compact"
                value={format}
                onchange={handleFormat}
            ></c-board-cpe-format-editor>
        </section>

        <section class="c-cpe-section c-metric-thresholds slds-m-top_medium" aria-label="Thresholds">
            <h3 class="slds-text-title_caps slds-m-bottom_x-small">Thresholds</h3>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                Rules are checked in order; the first match colors the value.
            </p>
            <template lwc:if={hasThresholds}>
                <ol class="c-metric-threshold-list">
                    <template for:each={thresholdRows} for:item="row">
                        <li key={row.key} class="c-metric-threshold slds-p-vertical_x-small" data-index={row.index}>
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                <span class="slds-text-title">{row.title}</span>
                                <div class="slds-shrink-none">
                                    <lightning-button-icon
                                        class="c-metric-threshold-up"
                                        icon-name="utility:arrowup"
                                        size="small"
                                        variant="bare"
                                        alternative-text="Move rule up"
                                        disabled={row.isFirst}
                                        data-index={row.index}
                                        onclick={handleMoveThresholdUp}
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                        class="c-metric-threshold-down"
                                        icon-name="utility:arrowdown"
                                        size="small"
                                        variant="bare"
                                        alternative-text="Move rule down"
                                        disabled={row.isLast}
                                        data-index={row.index}
                                        onclick={handleMoveThresholdDown}
                                    ></lightning-button-icon>
                                    <lightning-button-icon
                                        class="c-metric-threshold-remove"
                                        icon-name="utility:delete"
                                        size="small"
                                        variant="bare"
                                        alternative-text="Remove rule"
                                        data-index={row.index}
                                        onclick={handleRemoveThreshold}
                                    ></lightning-button-icon>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters_xx-small">
                                <lightning-combobox
                                    class="c-metric-threshold-operator slds-col"
                                    label="When value is"
                                    options={thresholdOperatorOptions}
                                    value={row.operator}
                                    data-index={row.index}
                                    onchange={handleThresholdOperator}
                                ></lightning-combobox>
                                <lightning-input
                                    class="c-metric-threshold-value slds-col"
                                    type="number"
                                    step="any"
                                    label="Value"
                                    value={row.value}
                                    data-index={row.index}
                                    onchange={handleThresholdValue}
                                ></lightning-input>
                                <lightning-combobox
                                    class="c-metric-threshold-variant slds-col"
                                    label="Status"
                                    options={thresholdVariantOptions}
                                    value={row.variant}
                                    data-index={row.index}
                                    onchange={handleThresholdVariant}
                                ></lightning-combobox>
                            </div>
                        </li>
                    </template>
                </ol>
            </template>
            <lightning-button
                class="c-metric-threshold-add slds-m-top_x-small"
                label="Add rule"
                icon-name="utility:add"
                onclick={handleAddThreshold}
            ></lightning-button>
            <lightning-button
                class="c-metric-threshold-dialog slds-m-top_x-small slds-m-left_x-small"
                label="Edit in dialog…"
                onclick={handleEditThresholdsInDialog}
            ></lightning-button>
        </section>
    </c-board-cpe-common>
</template>
