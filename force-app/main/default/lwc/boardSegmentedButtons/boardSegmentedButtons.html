<template>
    <div class="slds-button-group c-board-segments" role="group" aria-label={label}>
        <template for:each={items} for:item="item">
            <button
                key={item.key}
                type="button"
                class={item.className}
                aria-pressed={item.ariaPressed}
                disabled={disabled}
                data-value={item.value}
                onclick={handleClick}
            >
                {item.label}
            </button>
        </template>
    </div>
</template>
